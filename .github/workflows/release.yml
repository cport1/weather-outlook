name: Release

# Conventional commits on main → release-please keeps a "chore: release" PR up to date
# (version bump + CHANGELOG). Merging that PR tags a GitHub release and publishes to npm.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish:
    # The npm launcher downloads the release binary when Bun is missing, so
    # binaries must be on the GitHub release before the version hits npm.
    needs: [release-please, binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing (OIDC): no NPM_TOKEN secret, provenance attached automatically.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Prereleases (2.0.0-alpha.1) go to the `next` dist-tag so `npm i weather-outlook` stays on stable.
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "Publishing weather-outlook@$VERSION to dist-tag '$TAG'"
          npm publish --tag "$TAG"

  binaries:
    # Standalone executables (no Bun/Node needed) attached to the GitHub release.
    # Cross-compiled from one runner: Bun downloads each target's runtime, and OpenTUI's
    # native library comes from the per-platform @opentui/core-* packages.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Every platform's optional native package, not just the runner's.
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - run: bun scripts/compile.ts
      - name: Smoke test (linux-x64)
        run: |
          BIN=$(ls dist-bin/weather-outlook-*-linux-x64)
          test "$($BIN --version)" = "$(node -p "require('./package.json').version")"
          $BIN 40.0,-105.0 --once --no-color | head -5 || echo "one-shot failed (network?)"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd dist-bin
          sha256sum --check SHA256SUMS
          gh release upload "$TAG" weather-outlook-* SHA256SUMS --clobber
