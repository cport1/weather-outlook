<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">weather-outlook</title>
  <desc id="desc">The terminal weather dashboard: radar, hurricanes, wildfires and earthquakes on a live world map.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#132a3d"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#c4b5fd"/>
      <stop offset="0.75" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="temp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="0.3" stop-color="#4dd0a8"/>
      <stop offset="0.55" stop-color="#c6e05a"/>
      <stop offset="0.75" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#ff3d3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="18"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
      .drop { stroke: #4fc3f7; stroke-width: 2; stroke-linecap: round; opacity: .75; animation: fall 1.1s linear infinite; }
      .drop.b { stroke: #81d4fa; animation-duration: .9s; }
      .drop.c { stroke: #29b6f6; animation-duration: 1.3s; }
      @keyframes fall { from { transform: translate(0, -60px); opacity: 0; } 15% { opacity: .8; } to { transform: translate(-18px, 150px); opacity: 0; } }
      .bolt { fill: #fff59d; animation: flash 4.2s steps(1) infinite; opacity: 0; }
      .sky-flash { fill: #e3f2fd; animation: skyflash 4.2s steps(1) infinite; opacity: 0; }
      @keyframes flash { 0%, 61% { opacity: 0; } 62%, 64% { opacity: 1; } 65%, 66% { opacity: 0; } 67%, 69% { opacity: 1; } 70%, 100% { opacity: 0; } }
      @keyframes skyflash { 0%, 61% { opacity: 0; } 62% { opacity: .07; } 63%, 66% { opacity: 0; } 67% { opacity: .05; } 68%, 100% { opacity: 0; } }
      .star { fill: #fffde7; animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      .spin { transform-origin: 1086px 318px; animation: spin 2.4s linear infinite; }
      @keyframes spin { to { transform: rotate(-360deg); } }
      @media (prefers-reduced-motion: reduce) { .drop, .bolt, .sky-flash, .star, .spin { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#sky)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
    <rect class="sky-flash" width="1280" height="420"/>

    <!-- stars -->
    <g>
      <circle class="star" cx="80" cy="48" r="1.4"/>
      <circle class="star" cx="190" cy="92" r="1" style="animation-delay:.8s"/>
      <circle class="star" cx="310" cy="36" r="1.2" style="animation-delay:1.6s"/>
      <circle class="star" cx="455" cy="70" r="1" style="animation-delay:.4s"/>
      <circle class="star" cx="610" cy="30" r="1.5" style="animation-delay:2.1s"/>
      <circle class="star" cx="720" cy="84" r="1" style="animation-delay:1.1s"/>
      <circle class="star" cx="1210" cy="44" r="1.3" style="animation-delay:.6s"/>
      <circle class="star" cx="1250" cy="128" r="1" style="animation-delay:1.9s"/>
      <circle class="star" cx="40" cy="160" r="1" style="animation-delay:2.4s"/>
    </g>

    <!-- faint braille world-map texture along the bottom -->
    <text class="mono" x="40" y="398" font-size="15" fill="#1f3a2d" letter-spacing="1">⠀⢀⣀⣤⣶⣿⣿⣷⣦⣄⡀⠀⠀⠀⢀⣴⣾⣿⣿⣿⣿⣷⣦⣄⣀⠀⠀⠀⠀⣠⣴⣶⣿⣿⣿⣿⣿⣿⣿⣷⣶⣦⣤⣄⡀⠀⠀⠀⢀⣠⣤⣶⣿⣿⣿⣷⣦⣄⠀⠀⠀⣀⣤⣶⣾⣿⣿⣿⣿⣷⣶⣤⣀⠀⠀⠀⢀⣴⣿⣿⣿⣷⣄⠀⠀⠀⣀⣤⣶⣿⣿⣿⣿⣿⣷⣤⡀</text>

    <!-- storm cloud + rain + lightning (right side) -->
    <g transform="translate(1030 34) scale(0.82)">
      <g>
        <line class="drop" x1="58" y1="140" x2="52" y2="160"/>
        <line class="drop b" x1="88" y1="138" x2="82" y2="158" style="animation-delay:.3s"/>
        <line class="drop c" x1="118" y1="142" x2="112" y2="162" style="animation-delay:.6s"/>
        <line class="drop" x1="148" y1="138" x2="142" y2="158" style="animation-delay:.15s"/>
        <line class="drop b" x1="178" y1="142" x2="172" y2="162" style="animation-delay:.75s"/>
        <line class="drop c" x1="208" y1="138" x2="202" y2="158" style="animation-delay:.45s"/>
        <line class="drop" x1="73" y1="146" x2="67" y2="166" style="animation-delay:.9s"/>
        <line class="drop b" x1="163" y1="146" x2="157" y2="166" style="animation-delay:.2s"/>
        <line class="drop c" x1="193" y1="146" x2="187" y2="166" style="animation-delay:1s"/>
      </g>
      <g fill="none" stroke="#cfd8dc" stroke-width="3" stroke-linejoin="round" opacity=".9">
        <path d="M60 120 Q20 120 22 92 Q24 66 54 66 Q60 30 102 28 Q140 26 152 58 Q170 40 196 52 Q220 64 214 90 Q244 92 244 112 Q244 122 230 122 Z" fill="#0f1c2a"/>
      </g>
      <path class="bolt" d="M128 122 L106 176 L126 176 L112 226 L156 160 L134 160 L150 122 Z"/>
    </g>

    <!-- spinning hurricane glyph -->
    <g class="spin" fill="none" stroke="#ff8f20" stroke-width="3" stroke-linecap="round">
      <path d="M1086 300 a18 18 0 1 1 -18 18"/>
      <path d="M1086 336 a18 18 0 1 1 18 -18"/>
      <circle cx="1086" cy="318" r="4" fill="#ff8f20" stroke="none"/>
    </g>
    <text class="mono" x="1112" y="323" font-size="15" fill="#ffc140">Isaias C1</text>

    <!-- wordmark -->
    <text class="mono" x="64" y="168" font-size="78" font-weight="700" fill="url(#word)" letter-spacing="-1">weather-outlook</text>
    <text class="mono" x="68" y="214" font-size="22" fill="#e6edf3">The terminal weather dashboard.</text>
    <text class="mono" x="68" y="246" font-size="18" fill="#7a8794">Radar · hurricanes · wildfires · quakes · alerts · space weather — on a live world map.</text>

    <!-- temperature bar + prompt -->
    <rect x="68" y="276" width="420" height="6" rx="3" fill="url(#temp)"/>
    <g class="mono" font-size="20">
      <text x="68" y="330" fill="#7dd3fc">❯</text>
      <text x="92" y="330" fill="#e6edf3">npx weather-outlook</text>
      <rect x="332" y="314" width="11" height="20" fill="#7dd3fc">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text class="mono" x="68" y="362" font-size="14" fill="#3a4756">no API keys · Open-Meteo · NWS · NHC · NASA FIRMS · USGS · NOAA SWPC · RainViewer</text>
  </g>
  <rect width="1279" height="419" x=".5" y=".5" rx="18" fill="none" stroke="#223041"/>
</svg>
